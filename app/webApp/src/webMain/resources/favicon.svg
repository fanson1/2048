  <text x="256" y="322" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#000000" opacity="0.25" text-anchor="middle" dominant-baseline="central">2048</text>
  <text x="256" y="314" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2048</text>

  <!-- Tile 2 top-left -->
